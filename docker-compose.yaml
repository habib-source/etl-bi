include:
  - superset.yaml
services:
  spark:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./WideWorldImporters-etl/:/opt/spark/work-dir
    ports:
      - "8080:8080"
    environment:
      - SPARK_PUBLIC_DNS=localhost
  spark-worker:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    ports:
      - "8081:8081"
    depends_on:
      - spark
    environment:
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=2g
      - SPARK_PUBLIC_DNS=localhost
# docker exec -it spark-runner /opt/spark/bin/spark-submit --master spark://spark:7077 --packages com.microsoft.sqlserver:mssql-jdbc:13.6.2.jre11 --conf spark.jars.ivy=/tmp/.ivy2 src/etl.py
  spark-runner:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark-runner
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - ./WideWorldImporters-etl:/opt/spark/work-dir

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:latest
    command: server standalone
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kestra-data:/app/storage
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra_password
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
  flow-loader:
    image: curlimages/curl:latest
    depends_on:
      - kestra
    volumes:
      - ./flows:/flows:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://kestra:8080/api/v1/main/health > /dev/null 2>&1 || curl -sf http://kestra:8080/ > /dev/null 2>&1; do
          echo "Waiting for Kestra API..."
          sleep 2
        done
        for f in /flows/*.yml /flows/*.yaml; do
          [ -e "$$f" ] || continue
          echo "Deploying $$f..."
          curl -sf -X POST http://kestra:8080/api/v1/main/flows \
            -H "Content-Type: application/x-yaml" \
            --data-binary "@$$f"
        done
        echo "Flow deployment complete."
    restart: "no"



# docker exec -it wide-world-importers-db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev4oddJob" -C -W -Q "USE WideWorldImporters; SELECT TABLE_SCHEMA + '.' + TABLE_NAME AS TableName, STRING_AGG(COLUMN_NAME, ', ') WITHIN GROUP (ORDER BY ORDINAL_POSITION) AS Columns FROM INFORMATION_SCHEMA.COLUMNS GROUP BY TABLE_SCHEMA, TABLE_NAME ORDER BY TABLE_SCHEMA, TABLE_NAME;"


# test: docker exec -i wide-world-importers-db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev4oddJob" -C -b -W < seed_wwi.sql
# clean up test: docker exec -i wide-world-importers-db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev4oddJob" -C -b -W < cleanup_wwi.sql
  wide-world-importers-db:
    restart: always
    build:
      context: ./
    container_name: wide-world-importers-db
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Dev4oddJob
      MSSQL_PID: EnterpriseDeveloper
    volumes:
      - db:/var/opt/mssql


  data-warehouse-init:
    container_name: data-warehouse-init
    build:
      context: ./docker/dw/
    command: ./entrypoint.sh
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Dev4oddJob
      MSSQL_PID: EnterpriseDeveloper
    depends_on:
      - data-warehouse
  data-warehouse:
    restart: always
    container_name: data-warehouse
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Dev4oddJob
      MSSQL_PID: EnterpriseDeveloper
      MSSQL_DB: WideWorldImportersDW
    volumes:
      - dw:/var/opt/mssql
  evidence:
    image: evidencedev/serve:0.12.2
    user: "1000:998"
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      EVIDENCE_BASIC_USER: admin
      EVIDENCE_BASIC_PASSWORD: admin
      CUBE_HOST: cube
      CUBE_DATABASE: cube
      CUBE_USER: superset
      CUBE_PASSWORD: Dev4oddJob
      CUBE_SSLMODE: disable
    volumes:
      - ./my-inventory-dashboard:/project
    depends_on:
      - cube
  cube:
    container_name: cube
    restart: always
    image: cubejs/cube:v1.8
    ports:
      - "4000:4000"
      - "15432:15432"
    volumes:
      - ./model:/cube/conf/model
    environment:
      CUBEJS_DEV_MODE: true
      # mssql integ
      CUBEJS_DB_TYPE: mssql
      CUBEJS_DB_HOST: data-warehouse
      CUBEJS_DB_PORT: 1433
      CUBEJS_DB_NAME: WideWorldImportersDW
      CUBEJS_DB_USER: sa
      CUBEJS_DB_PASS: Dev4oddJob
      # pg endpoint for superset
      CUBEJS_PG_SQL_PORT: 15432
      CUBEJS_SQL_USER: superset
      CUBEJS_SQL_PASSWORD: Dev4oddJob
  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: unless-stopped
    depends_on:
      - wide-world-importers-db
      - data-warehouse
    ports:
      - "3000:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    environment:
      # LOGIN: "admin"
      # PASSWORD: "WebUIPassword123!"

      CONNECTIONS: "wwdb,dw"

      LABEL_wwdb: "wide-world-importers-db SQL Server"
      SERVER_wwdb: "wide-world-importers-db"
      PORT_wwdb: "1433"
      USER_wwdb: "sa"
      PASSWORD_wwdb: "Dev4oddJob"
      ENGINE_wwdb: "mssql@dbgate-plugin-mssql"

      LABEL_dw: "data-warehouse SQL Server"
      SERVER_dw: "data-warehouse"
      PORT_dw: "1433"
      USER_dw: "sa"
      PASSWORD_dw: "Dev4oddJob"
      ENGINE_dw: "mssql@dbgate-plugin-mssql"


volumes:
  db:
  dw:
  dbgate_data:
  postgres-data:
  kestra-data:
