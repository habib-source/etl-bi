include:
  - superset.yaml
services:
  spark:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
    environment:
      - SPARK_PUBLIC_DNS=localhost
  spark-worker:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    ports:
      - "8081:8081"
    depends_on:
      - spark
    environment:
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=2g
      - SPARK_PUBLIC_DNS=localhost
# docker exec -it spark-runner /opt/spark/bin/spark-submit --master spark://spark:7077 --packages com.microsoft.sqlserver:mssql-jdbc:13.6.2.jre11 --conf spark.jars.ivy=/tmp/.ivy2 src/etl.py
  spark-runner:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark-runner
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - ./WideWorldImporters-etl:/opt/spark/work-dir

