include:
  - superset.yaml
services:
  spark:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./WideWorldImporters-etl/:/opt/spark/work-dir
    ports:
      - "8080:8080"
  spark-worker:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    ports:
      - "8081:8081"
    depends_on:
      - spark
    environment:
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=2g
  spark-runner:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    container_name: spark-runner
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - ./WideWorldImporters-etl:/opt/spark/work-dir

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    container_name: kestra
    image: kestra/kestra:v2.0
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 6m
    user: "root"
    command: server standalone
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8081/health >/dev/null || wget -q -O /dev/null http://localhost:8081/health || (exec 3<>/dev/tcp/127.0.0.1/8081) >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - kestra-data:/app/storage
      - /tmp/kestra-wd:/tmp/kestra-wd
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KESTRA_CONFIGURATION: |
        micronaut:
          server:
            port: 8084
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra_password
        kestra:
          server:
            basic-auth:
              username: 'admin@etl.com'
              password: 'DFAFa6g}X~"Tx&,'
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
    ports:
      - "8084:8084"
  flow-loader:
    container_name: flow-loader
    image: kestra/kestractl:3.12
    restart: "no"
    depends_on:
      kestra:
        condition: service_healthy
    volumes:
      - ./flows:/flows:ro
      - ./WideWorldImporters-etl:/WideWorldImporters-etl:ro
    environment:
      KESTRACTL_HOST: "http://kestra:8084"
      KESTRACTL_TENANT: "main"
      KESTRACTL_USERNAME: "admin@etl.com"
      KESTRACTL_PASSWORD: 'DFAFa6g}X~"Tx&,'
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Uploading etl.py to namespace data.pipelines..."
        kestractl nsfiles upload data.pipelines /WideWorldImporters-etl/src/etl.py WideWorldImporters-etl/src/etl.py \
          --override --fail-fast
        echo "Deploying flows from /flows..."
        kestractl flows deploy /flows --override --fail-fast
        echo "Deployment complete."
  wide-world-importers-db:
    restart: always
    build:
      context: ./docker/wwidb
    container_name: wide-world-importers-db
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Dev4oddJob
      MSSQL_PID: EnterpriseDeveloper
    volumes:
      - db:/var/opt/mssql

  data-warehouse-init:
    container_name: data-warehouse-init
    build:
      context: ./docker/dw/
    command: ./entrypoint.sh
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Dev4oddJob
      MSSQL_PID: EnterpriseDeveloper
    depends_on:
      - data-warehouse
  data-warehouse:
    restart: always
    container_name: data-warehouse
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Dev4oddJob
      MSSQL_PID: EnterpriseDeveloper
      MSSQL_DB: WideWorldImportersDW
    volumes:
      - dw:/var/opt/mssql
  evidence:
    image: evidencedev/serve:0.12.2
    user: "1000:998"
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      EVIDENCE_BASIC_USER: admin
      EVIDENCE_BASIC_PASSWORD: admin
      CUBE_HOST: cube
      CUBE_DATABASE: cube
      CUBE_USER: superset
      CUBE_PASSWORD: Dev4oddJob
      CUBE_SSLMODE: disable
    volumes:
      - ./my-inventory-dashboard:/project
    depends_on:
      - cube
  cube:
    container_name: cube
    restart: always
    image: cubejs/cube:v1.8
    ports:
      - "4000:4000"
      - "15432:15432"
    volumes:
      - ./model:/cube/conf/model
    environment:
      CUBEJS_DEV_MODE: true
      # mssql integ
      CUBEJS_DB_TYPE: mssql
      CUBEJS_DB_HOST: data-warehouse
      CUBEJS_DB_PORT: 1433
      CUBEJS_DB_NAME: WideWorldImportersDW
      CUBEJS_DB_USER: sa
      CUBEJS_DB_PASS: Dev4oddJob
      # pg endpoint
      CUBEJS_PG_SQL_PORT: 15432
      CUBEJS_SQL_USER: superset
      CUBEJS_SQL_PASSWORD: Dev4oddJob
  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: unless-stopped
    depends_on:
      - wide-world-importers-db
      - data-warehouse
    ports:
      - "3000:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    environment:
      # LOGIN: "admin"
      # PASSWORD: "WebUIPassword123!"

      CONNECTIONS: "wwdb,dw"

      LABEL_wwdb: "wide-world-importers-db SQL Server"
      SERVER_wwdb: "wide-world-importers-db"
      PORT_wwdb: "1433"
      USER_wwdb: "sa"
      PASSWORD_wwdb: "Dev4oddJob"
      ENGINE_wwdb: "mssql@dbgate-plugin-mssql"

      LABEL_dw: "data-warehouse SQL Server"
      SERVER_dw: "data-warehouse"
      PORT_dw: "1433"
      USER_dw: "sa"
      PASSWORD_dw: "Dev4oddJob"
      ENGINE_dw: "mssql@dbgate-plugin-mssql"

volumes:
  db:
  dw:
  dbgate_data:
  postgres-data:
  kestra-data:
networks:
  default:
    name: etl
