cubes:
  - name: dim_stock_item
    sql_table: dw.DimStockItem
    public: false
    description: Product and SKU catalog attributes including packaging, pricing, cold-chain flags, and supplier lead times.

    dimensions:
      - name: stock_item_key
        sql: StockItemKey
        type: number
        primary_key: true
        description: Surrogate primary key uniquely identifying the stock item record in the warehouse.

      - name: stock_item_id
        sql: StockItemID
        type: number
        description: Natural business identifier for the stock item from the source operational system.

      - name: stock_item_name
        sql: StockItemName
        type: string
        description: Descriptive name of the product or SKU.

      - name: brand
        sql: Brand
        type: string
        description: Brand or manufacturer label associated with the stock item.

      - name: size
        sql: Size
        type: string
        description: Physical size specification or variant of the stock item.

      - name: color_name
        sql: ColorName
        type: string
        description: Color attribute of the stock item.

      - name: unit_package_name
        sql: UnitPackageName
        type: string
        description: Packaging type used for individual selling units (e.g., Each, Packet, Box).

      - name: outer_package_name
        sql: OuterPackageName
        type: string
        description: Bulk or outer case packaging type used for shipping and storage (e.g., Carton, Pallet).

      - name: stock_group_names
        sql: StockGroupNames
        type: string
        description: Comma-separated or concatenated product categories and stock groups assigned to the item.

      - name: is_chiller_stock
        sql: IsChillerStock
        type: boolean
        description: Indicates whether the item requires refrigerated or chilled storage.

      - name: lead_time_days
        sql: LeadTimeDays
        type: number
        description: Expected replenishment lead time in days from order placement to receipt.

      - name: quantity_per_outer
        sql: QuantityPerOuter
        type: number
        description: Number of individual selling units contained in one outer package.

      - name: tax_rate
        sql: TaxRate
        type: number
        description: Applicable sales or value-added tax percentage for the item.

      - name: unit_price
        sql: UnitPrice
        type: number
        description: Standard selling price per individual unit.

      - name: recommended_retail_price
        sql: RecommendedRetailPrice
        type: number
        description: Manufacturer or catalog recommended retail price (RRP) per unit.

      - name: typical_weight_per_unit
        sql: TypicalWeightPerUnit
        type: number
        description: Standard physical weight of a single unit of the stock item.

      - name: barcode
        sql: Barcode
        type: string
        description: Scannable product barcode (UPC/EAN/GTIN).
